name: CI

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    # A real Postgres, not mocked -- Phase 2 (P2-2) needs to verify
    # actual idempotency/uniqueness guarantees (e.g. customer/db.py's
    # get_or_create not creating a duplicate row under concurrency),
    # which a mock can't meaningfully assert. This is the one
    # deliberate exception to "tests/unit/ ... no live services" --
    # see CLAUDE.md's Testing section.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loan_onboarding
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d loan_onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Phase 9 (P9-3): bff_backoffice/session_store.py's tests hit a
      # real Redis (same "no live services, except when correctness-
      # critical" exception as Postgres above -- TTL-sliding behavior
      # can't be meaningfully asserted against a mock).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Apply database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d loan_onboarding -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h localhost -U postgres -d loan_onboarding -f db/schema.sql

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/loan_onboarding
          BACKOFFICE_REDIS_URL: redis://localhost:6379/0
        run: pytest tests/unit

      # Phase 8 (IMPLEMENTATION_PLAN.md): import-linter, encoding the
      # module dependency graph from CLAUDE.md's "Module dependency
      # graph" section (pyproject.toml's [tool.importlinter]). Required,
      # not informational -- a violation here fails the build.
      - name: Check module boundaries (import-linter)
        run: lint-imports

      # No tests/contract/ step -- CLAUDE.md's "Testing" section: the
      # application/schemas.py assert against
      # workflow.task_queues.KNOWN_PRODUCT_TYPES does that job at
      # import time, in every test run (including this one), for free.
