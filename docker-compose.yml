name: loan-onboarding-poc

# Grew up in phases (IMPLEMENTATION_PLAN.md): P0-4 laid down db,
# temporal, temporal-ui, keycloak, backoffice-redis; P5-1 added
# mayan-db/mayan-redis/mayan (renamed from mayan-edms-customer-archive's
# own db/redis/app to avoid colliding with this file's own `db`/
# `backoffice-redis` -- that project's `webapp` demo front end was
# dropped, since document/ talks to Mayan's API directly); P7-2 added
# worker-workflow/worker-activity (review-approval-temporal's
# WORKER_MODE split -- workflow code is pure/deterministic and never
# touches Postgres or Mayan, so worker-workflow gets neither
# DATABASE_URL nor Mayan credentials; worker-activity runs
# application/activities.py's real implementations, so it needs both);
# P12-3 added `app`, the single web process, once both BFFs (Phase 10,
# Phase 11) existed to mount into it.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-loan_onboarding}
    ports:
      # Published on 5433, NOT 5432 -- a native macOS Postgres binding
      # 127.0.0.1:5432 wins over Docker's own published 5432 for any
      # client connecting to "localhost"/"127.0.0.1" (confirmed directly:
      # `psql localhost:5432` and pgAdmin both silently hit the native
      # instance and fail with "role postgres does not exist", not this
      # container). Every in-Compose service still reaches this one via
      # the internal hostname `db:5432`, unaffected by the host port
      # chosen here -- only host-side tools (pgAdmin, a native `psql`,
      # DATABASE_URL for a natively-run app.py/worker_main.py) need to
      # use 5433 explicitly.
      - "5433:5432"
    volumes:
      # This script runs from here (official postgres image behavior).
      - ./db/init:/docker-entrypoint-initdb.d
      # schema.sql is read from here, NOT placed directly under
      # db/init/ -- see db/init/01-init.sh's own header comment for
      # why (the postgres image would auto-run it a second time).
      - ./db:/db-source:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-loan_onboarding}"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: db
    ports:
      - "7233:7233"
    depends_on:
      db:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:8233"
    ports:
      - "8233:8080"
    depends_on:
      - temporal
    # Deliberately NOT gated behind Keycloak -- CLAUDE.md's "Identity"
    # scopes Keycloak auth to the back-office *application*, not
    # Temporal's own operational tooling (see "Deliberately not built").

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      # Pins Keycloak's own notion of its issuer/hostname to the one
      # public URL, regardless of which network path a request arrives
      # on -- found necessary in P12-3, the hard way: with
      # `hostname-strict=false` (this image's `start-dev` default),
      # Keycloak derives the issuer it validates a bearer token against
      # from *that request's own Host header*, per request. A UMA
      # ticket exchange or refresh-token call `app`'s server-to-server
      # code sends to the internal `http://keycloak:8080/...` was
      # rejected outright -- "401 invalid_grant: Invalid bearer token"
      # -- for a perfectly valid token, purely because the token's own
      # `iss` claim (stamped as `http://localhost:8080/...`, from the
      # browser's original front-channel request) didn't match the
      # `keycloak:8080` Host header *that specific internal request*
      # arrived on. Fixing only this app's own issuer-claim validation
      # (`KEYCLOAK_PUBLIC_ISSUER`, `_public_issuer()`/
      # `_public_keycloak_issuer()`) was necessary but not sufficient --
      # Keycloak itself was independently rejecting the token before
      # our code ever got to check anything. Pinning the hostname here
      # makes Keycloak mint and validate every token against this one
      # fixed issuer regardless of which URL reached it, which is what
      # actually closes the gap.
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      # Empty until Phase 9 (P9-1) adds loanrealm-realm.json here --
      # --import-realm is a no-op against an empty directory, so
      # Keycloak still starts cleanly with no realm imported yet.
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  backoffice-redis:
    image: redis:7-alpine
    # Named distinctly from mayan-redis (Phase 5) -- CLAUDE.md's
    # "Data storage": Keycloak sessions + bulk-selection for
    # bff_backoffice only, never shared with Mayan's own cache.
    # Published on a non-default host port (6380, not 6379) so
    # bff_backoffice/session_store.py's own tests (P9-3/P9-4) -- and any
    # natively-run bff_backoffice process before Phase 10's `app`
    # Compose service exists -- can reach it via
    # BACKOFFICE_REDIS_URL=redis://localhost:6380/0, same convention
    # .env.example's own header comment already documents for `db`.
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- P5-1: copied from mayan-edms-customer-archive/docker-compose.yml,
  # renamed per this file's header comment (db -> mayan-db, redis ->
  # mayan-redis, app -> mayan) to avoid colliding with this project's own
  # `db`/`backoffice-redis`. `webapp` (that project's demo front end)
  # deliberately dropped -- document/ talks to Mayan's API directly, no
  # demo UI needed here.
  mayan-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mayan
      POSTGRES_USER: mayan
      POSTGRES_PASSWORD: ${MAYAN_POSTGRES_PASSWORD:-mayan}
    volumes:
      - mayan_db_data:/var/lib/postgresql/data

  mayan-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --databases 3
    volumes:
      - mayan_redis_data:/data

  mayan:
    image: mayanedms/mayanedms:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'mayan','USER':'mayan','PASSWORD':'${MAYAN_POSTGRES_PASSWORD:-mayan}','HOST':'mayan-db'}}"
      MAYAN_CELERY_BROKER_URL: "redis://mayan-redis:6379/0"
      MAYAN_CELERY_RESULT_BACKEND: "redis://mayan-redis:6379/1"
      MAYAN_LOCK_MANAGER_BACKEND: "mayan.apps.lock_manager.backends.redis_lock.RedisLock"
      MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: "{'redis_url':'redis://mayan-redis:6379/2'}"
      MAYAN_AUTOADMIN_USERNAME: ${MAYAN_SERVICE_ACCOUNT_USERNAME:-admin}
      MAYAN_AUTOADMIN_PASSWORD: ${MAYAN_SERVICE_ACCOUNT_PASSWORD:-changeme}
      # Gunicorn's own request timeout (default 120s) -- bumped for this
      # project's memory-constrained dev box, where a request can end up
      # queued behind real Celery congestion (confirmed live via
      # `docker logs mayan` showing `whoosh.index.LockError` under
      # concurrent index/deindex tasks -- see scripts/generate_real_e2e_data.py's
      # own retry/backoff for that specific error, which this setting
      # does NOT fix: Whoosh's writer lock itself has a hardcoded
      # timeout=0.0 with no Mayan-exposed setting to change it. This
      # only widens the window before Gunicorn kills a slow-but-still-
      # working request.
      MAYAN_GUNICORN_TIMEOUT: 300
    volumes:
      - mayan_app_data:/var/lib/mayan
    depends_on:
      - mayan-db
      - mayan-redis

  # --- P7-2: worker processes (worker_main.py), same WORKER_MODE-split
  # pattern as review-approval-temporal's own worker-workflow/
  # worker-activity services.
  worker-workflow:
    build: .
    command: python -m loan_onboarding.worker_main
    depends_on:
      temporal:
        condition: service_started
    environment:
      WORKER_MODE: workflow
      LOAN_PRODUCT_TYPE: ${LOAN_PRODUCT_TYPE:-}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      # No DATABASE_URL or MAYAN_* here on purpose -- workflow code is
      # pure/deterministic and never touches Postgres or Mayan, so this
      # service runs with zero DB/Mayan credentials.
    restart: on-failure

  worker-activity:
    build: .
    command: python -m loan_onboarding.worker_main
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      WORKER_MODE: activity
      LOAN_PRODUCT_TYPE: ${LOAN_PRODUCT_TYPE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-loan_onboarding}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      MAYAN_BASE_URL: http://mayan:8000
      MAYAN_SERVICE_ACCOUNT_USERNAME: ${MAYAN_SERVICE_ACCOUNT_USERNAME:-admin}
      MAYAN_SERVICE_ACCOUNT_PASSWORD: ${MAYAN_SERVICE_ACCOUNT_PASSWORD:-changeme}
    restart: on-failure

  # --- P12-3: the single web process (app.py mounts both bff_customer
  # and bff_backoffice's routers -- CLAUDE.md's "Deployment"). Published
  # on host port 8001, NOT 8000 -- CLAUDE.md's "Known gaps" flagged that
  # 8000 collides with `mayan`'s own already-published host port 8000;
  # 8001 was already registered as this project's documented
  # native-dev-server redirect URI
  # (keycloak/import/loanrealm-realm.json's `http://localhost:8001/ui/callback`),
  # so publishing the containerized app there too needs zero realm
  # changes -- bff_backoffice/routes.py's `_redirect_uri()` derives the
  # callback URL from the browser's own request (`request.base_url`),
  # not a hardcoded host/port, so whichever host port the browser
  # actually used is what gets sent to Keycloak.
  app:
    build: .
    command: uvicorn loan_onboarding.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started
      keycloak:
        condition: service_started
      backoffice-redis:
        condition: service_healthy
      mayan:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-loan_onboarding}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/loanrealm
      # The browser needs a host-reachable URL for the two redirects
      # keycloak_session.py sends it to (login, logout) -- `keycloak`
      # only resolves inside this compose network. Every other Keycloak
      # call (token exchange, JWKS, UMA permission checks) is
      # server-to-server, from inside this container, and correctly
      # keeps using KEYCLOAK_ISSUER above. `keycloak_auth.py`'s
      # `decode_token()` also needs this value specifically for its
      # issuer-claim check (not just the two browser redirects) -- a
      # token's `iss` claim matches the front-channel/public URL, not
      # whichever URL the server used to fetch it. See both modules'
      # `_public_issuer()`/`_public_keycloak_issuer()`.
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8080/realms/loanrealm
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-loan-onboarding-backoffice}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-dev-secret-change-me}
      BACKOFFICE_SESSION_SECRET_KEY: ${BACKOFFICE_SESSION_SECRET_KEY:-dev-secret-change-me}
      BACKOFFICE_REDIS_URL: redis://backoffice-redis:6379/0
      CUSTOMER_SESSION_SECRET_KEY: ${CUSTOMER_SESSION_SECRET_KEY:-dev-secret-change-me}
      MAYAN_BASE_URL: http://mayan:8000
      MAYAN_SERVICE_ACCOUNT_USERNAME: ${MAYAN_SERVICE_ACCOUNT_USERNAME:-admin}
      MAYAN_SERVICE_ACCOUNT_PASSWORD: ${MAYAN_SERVICE_ACCOUNT_PASSWORD:-changeme}
    restart: on-failure

volumes:
  db_data:
  mayan_db_data:
  mayan_redis_data:
  mayan_app_data:
