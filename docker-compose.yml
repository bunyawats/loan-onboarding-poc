name: loan-onboarding-poc

# Phase 0 skeleton (IMPLEMENTATION_PLAN.md P0-4): db, temporal,
# temporal-ui, keycloak, backoffice-redis only. No app/worker services
# yet -- those come once there's code to run (Phase 7/10/11).
#
# mayan-db/mayan-redis/mayan are DELIBERATELY NOT here yet -- P5-1
# copies them "wholesale" from mayan-edms-customer-archive/docker-compose.yml,
# but that file's actual service names are db/redis/app, not
# mayan-db/mayan-redis/mayan, and its `db`/`redis` names collide with
# this file's own `db` (Postgres) and `backoffice-redis` -- P5-1 needs
# a rename pass (db -> mayan-db, redis -> mayan-redis, app -> mayan),
# not a literal copy-paste. Its `webapp` service (a demo front end) has
# no equivalent need here, since document/ talks to Mayan's API
# directly.
#
# worker-workflow/worker-activity (P7-2) follow review-approval-
# temporal's own identical WORKER_MODE split: workflow code is pure/
# deterministic and never touches Postgres or Mayan, so worker-workflow
# gets neither DATABASE_URL nor Mayan credentials; worker-activity runs
# application/activities.py's real implementations, so it needs both
# (DATABASE_URL for the applications/customers/accounts tables it
# writes to on approval, Mayan credentials for the two managed-document
# calls in that same provisioning block). No `app`/`app-customer`/
# `app-backoffice` service yet -- those come in Phase 10/11 once the
# BFFs exist.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-loan_onboarding}
    ports:
      - "5432:5432"
    volumes:
      # This script runs from here (official postgres image behavior).
      - ./db/init:/docker-entrypoint-initdb.d
      # schema.sql is read from here, NOT placed directly under
      # db/init/ -- see db/init/01-init.sh's own header comment for
      # why (the postgres image would auto-run it a second time).
      - ./db:/db-source:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-loan_onboarding}"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_SEEDS: db
    ports:
      - "7233:7233"
    depends_on:
      db:
        condition: service_healthy

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:8233"
    ports:
      - "8233:8080"
    depends_on:
      - temporal
    # Deliberately NOT gated behind Keycloak -- CLAUDE.md's "Identity"
    # scopes Keycloak auth to the back-office *application*, not
    # Temporal's own operational tooling (see "Deliberately not built").

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
    volumes:
      # Empty until Phase 9 (P9-1) adds loanrealm-realm.json here --
      # --import-realm is a no-op against an empty directory, so
      # Keycloak still starts cleanly with no realm imported yet.
      - ./keycloak/import:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"

  backoffice-redis:
    image: redis:7-alpine
    # Named distinctly from mayan-redis (Phase 5) -- CLAUDE.md's
    # "Data storage": Keycloak sessions + bulk-selection for
    # bff_backoffice only, never shared with Mayan's own cache.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- P5-1: copied from mayan-edms-customer-archive/docker-compose.yml,
  # renamed per this file's header comment (db -> mayan-db, redis ->
  # mayan-redis, app -> mayan) to avoid colliding with this project's own
  # `db`/`backoffice-redis`. `webapp` (that project's demo front end)
  # deliberately dropped -- document/ talks to Mayan's API directly, no
  # demo UI needed here.
  mayan-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mayan
      POSTGRES_USER: mayan
      POSTGRES_PASSWORD: ${MAYAN_POSTGRES_PASSWORD:-mayan}
    volumes:
      - mayan_db_data:/var/lib/postgresql/data

  mayan-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --databases 3
    volumes:
      - mayan_redis_data:/data

  mayan:
    image: mayanedms/mayanedms:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'mayan','USER':'mayan','PASSWORD':'${MAYAN_POSTGRES_PASSWORD:-mayan}','HOST':'mayan-db'}}"
      MAYAN_CELERY_BROKER_URL: "redis://mayan-redis:6379/0"
      MAYAN_CELERY_RESULT_BACKEND: "redis://mayan-redis:6379/1"
      MAYAN_LOCK_MANAGER_BACKEND: "mayan.apps.lock_manager.backends.redis_lock.RedisLock"
      MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: "{'redis_url':'redis://mayan-redis:6379/2'}"
      MAYAN_AUTOADMIN_USERNAME: ${MAYAN_SERVICE_ACCOUNT_USERNAME:-admin}
      MAYAN_AUTOADMIN_PASSWORD: ${MAYAN_SERVICE_ACCOUNT_PASSWORD:-changeme}
    volumes:
      - mayan_app_data:/var/lib/mayan
    depends_on:
      - mayan-db
      - mayan-redis

  # --- P7-2: worker processes (worker_main.py), same WORKER_MODE-split
  # pattern as review-approval-temporal's own worker-workflow/
  # worker-activity services.
  worker-workflow:
    build: .
    command: python -m loan_onboarding.worker_main
    depends_on:
      temporal:
        condition: service_started
    environment:
      WORKER_MODE: workflow
      LOAN_PRODUCT_TYPE: ${LOAN_PRODUCT_TYPE:-}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      # No DATABASE_URL or MAYAN_* here on purpose -- workflow code is
      # pure/deterministic and never touches Postgres or Mayan, so this
      # service runs with zero DB/Mayan credentials.
    restart: on-failure

  worker-activity:
    build: .
    command: python -m loan_onboarding.worker_main
    depends_on:
      db:
        condition: service_healthy
      temporal:
        condition: service_started
    environment:
      WORKER_MODE: activity
      LOAN_PRODUCT_TYPE: ${LOAN_PRODUCT_TYPE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-loan_onboarding}
      TEMPORAL_HOST: temporal:7233
      TEMPORAL_NAMESPACE: default
      MAYAN_BASE_URL: http://mayan:8000
      MAYAN_SERVICE_ACCOUNT_USERNAME: ${MAYAN_SERVICE_ACCOUNT_USERNAME:-admin}
      MAYAN_SERVICE_ACCOUNT_PASSWORD: ${MAYAN_SERVICE_ACCOUNT_PASSWORD:-changeme}
    restart: on-failure

volumes:
  db_data:
  mayan_db_data:
  mayan_redis_data:
  mayan_app_data:
