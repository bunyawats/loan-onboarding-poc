{% extends "base.html" %}
{% block title %}Sign in -- Loan Onboarding{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-1">Welcome</h1>
<p class="text-sm text-gray-600 mb-6">Enter your email address to view or start a loan application. We'll send you a one-time code -- no password needed.</p>

{% if error %}
<div class="mb-4 px-3 py-2.5 rounded-md bg-red-50 text-red-700 text-sm border border-red-200">{{ error }}</div>
{% endif %}

<form method="post" action="/apply/identify" class="space-y-4">
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1.5" for="applicant_identifier">Email address</label>
    <input id="applicant_identifier" name="applicant_identifier" type="email" required autofocus
      class="w-full min-h-12 px-3.5 py-3 text-base border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
  </div>
  <button type="submit"
    class="w-full min-h-12 px-4 py-3 text-base font-medium rounded-lg bg-blue-600 text-white hover:bg-blue-700">
    Send me a code
  </button>
</form>
{% endblock %}
