[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-onboarding-poc"
version = "0.1.0"
description = "Loan onboarding POC -- modular monolith (customer/back-office BFFs, Temporal workflow, Mayan EDMS documents, Keycloak-gated back office)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "temporalio",
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "pydantic",
    "pydantic-settings",
    "pyjwt[crypto]",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "httpx",
    "redis",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "import-linter",
]

[tool.setuptools.packages.find]
include = ["loan_onboarding*"]

# P8-1: encodes CLAUDE.md's "Module dependency graph" section --
# literally, not just informally. A layers contract captures the
# overall hierarchy (leaf modules with nothing below them, application
# above them, both BFFs above application-and-below, composition roots
# on top), and a `forbidden` contract per explicitly-bulleted "never
# imports" rule gives a direct, traceable 1:1 mapping to that section's
# own wording -- both together, not one or the other, per this task's
# own phrasing ("every 'never imports' rule as a forbidden contract,
# every 'leaf module' as a layer with nothing below it").
[tool.importlinter]
root_packages = ["loan_onboarding"]

[[tool.importlinter.contracts]]
name = "Overall layering (leaves -> application -> BFFs -> composition roots)"
type = "layers"
# P18-4 split account/ out of the "customer | account | document |
# workflow" bar and below workflow/ -- account/ now imports workflow/
# (to start/signal CloseAccountWorkflow, CLAUDE.md's "Account closure")
# and a `layers` contract enforces sibling independence between modules
# sharing one "|" bar, so account/ importing a same-bar sibling
# (workflow/) would have broken this contract even though the module-
# specific forbidden contracts below both already allow it. customer/
# and document/ still don't depend on workflow/ or account/, so they
# stay paired above both. workflow/ itself imports nothing internal
# (see its own forbidden contract), so it needs no layer below it
# except the shared leaves.
layers = [
    "(app) | worker_main | reconcile",
    "bff_customer | bff_backoffice",
    "application",
    "customer | document",
    "account",
    "workflow",
    "idgen | notifications | risk",
]
containers = ["loan_onboarding"]

[[tool.importlinter.contracts]]
name = "customer/ never imports anything else in this codebase"
type = "forbidden"
source_modules = ["loan_onboarding.customer"]
forbidden_modules = [
    "loan_onboarding.account",
    "loan_onboarding.document",
    "loan_onboarding.workflow",
    "loan_onboarding.application",
    "loan_onboarding.bff_customer",
    "loan_onboarding.bff_backoffice",
    "loan_onboarding.worker_main",
    "loan_onboarding.reconcile",
]

[[tool.importlinter.contracts]]
name = "account/ never imports anything else in this codebase, except workflow/ and notifications/ (Phase 18)"
type = "forbidden"
# P18-4: account/ gained two justified exceptions -- workflow/ (to
# start/signal CloseAccountWorkflow, the same role application/ already
# has) and notifications/ (the closure-decision email) -- see CLAUDE.md's
# "Account closure" and module-dependency-graph sections. customer/
# stays fully forbidden: account/ still doesn't resolve
# customer_id -> applicant_identifier itself (see
# account/service.py's request_closure() docstring for why that value
# is threaded through as an opaque parameter instead).
source_modules = ["loan_onboarding.account"]
forbidden_modules = [
    "loan_onboarding.customer",
    "loan_onboarding.document",
    "loan_onboarding.application",
    "loan_onboarding.bff_customer",
    "loan_onboarding.bff_backoffice",
    "loan_onboarding.worker_main",
    "loan_onboarding.reconcile",
]

[[tool.importlinter.contracts]]
name = "idgen/ never imports anything else in this codebase"
type = "forbidden"
source_modules = ["loan_onboarding.idgen"]
forbidden_modules = [
    "loan_onboarding.customer",
    "loan_onboarding.account",
    "loan_onboarding.document",
    "loan_onboarding.workflow",
    "loan_onboarding.application",
    "loan_onboarding.bff_customer",
    "loan_onboarding.bff_backoffice",
    "loan_onboarding.worker_main",
    "loan_onboarding.reconcile",
]

[[tool.importlinter.contracts]]
name = "notifications/ never imports anything else in this codebase"
type = "forbidden"
source_modules = ["loan_onboarding.notifications"]
forbidden_modules = [
    "loan_onboarding.customer",
    "loan_onboarding.account",
    "loan_onboarding.document",
    "loan_onboarding.workflow",
    "loan_onboarding.application",
    "loan_onboarding.bff_customer",
    "loan_onboarding.bff_backoffice",
    "loan_onboarding.worker_main",
    "loan_onboarding.reconcile",
]

[[tool.importlinter.contracts]]
name = "risk/ never imports anything else in this codebase, except idgen/ (Phase 21)"
type = "forbidden"
# P21-3: risk/ is the thinnest leaf in the codebase -- one httpx.post()
# call to the standalone risk-adapter service, no NATS awareness at
# all (that lives entirely outside this Python package -- see
# CLAUDE.md's "Automated risk assessment via NATS"). idgen/ is left
# available (the same exception every other leaf gets) even though
# this module doesn't currently generate its own id.
source_modules = ["loan_onboarding.risk"]
forbidden_modules = [
    "loan_onboarding.customer",
    "loan_onboarding.account",
    "loan_onboarding.document",
    "loan_onboarding.workflow",
    "loan_onboarding.application",
    "loan_onboarding.notifications",
    "loan_onboarding.bff_customer",
    "loan_onboarding.bff_backoffice",
    "loan_onboarding.worker_main",
    "loan_onboarding.reconcile",
]

[[tool.importlinter.contracts]]
name = "document/ never imports application/ or workflow/"
type = "forbidden"
source_modules = ["loan_onboarding.document"]
forbidden_modules = ["loan_onboarding.application", "loan_onboarding.workflow"]

[[tool.importlinter.contracts]]
name = "workflow/ never imports application/, document/, customer/, or account/"
type = "forbidden"
source_modules = ["loan_onboarding.workflow"]
forbidden_modules = [
    "loan_onboarding.application",
    "loan_onboarding.document",
    "loan_onboarding.customer",
    "loan_onboarding.account",
]

[[tool.importlinter.contracts]]
name = "bff_customer/ and bff_backoffice/ never import each other"
type = "forbidden"
source_modules = ["loan_onboarding.bff_customer"]
forbidden_modules = ["loan_onboarding.bff_backoffice"]

[[tool.importlinter.contracts]]
name = "bff_backoffice/ and bff_customer/ never import each other"
type = "forbidden"
source_modules = ["loan_onboarding.bff_backoffice"]
forbidden_modules = ["loan_onboarding.bff_customer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Both scopes must match and be session-wide -- a module's
# lazily-initialized asyncpg pool (e.g. customer/db.py's _pool) is
# bound to whichever event loop first created it. If fixtures and test
# bodies ran in different loop scopes, the pool created by one would
# get used from the other, and asyncpg raises confusing mid-operation
# errors ("another operation is in progress") rather than a clean
# "wrong loop" error -- caught by actually running these tests, not
# assumed safe from reading pytest-asyncio's docs.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the real local stack (docker compose), not just Postgres",
]
